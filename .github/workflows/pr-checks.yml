name: PR checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch of the candidate fix PR
        required: true
        default: main
        type: string
permissions:
  contents: read
jobs:
  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace against the PR base
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref }}
        run: |
          git check-ref-format "refs/heads/$BASE_REF"
          git fetch --no-tags origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git diff --check "origin/$BASE_REF...HEAD"
