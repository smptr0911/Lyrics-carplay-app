name: iOS CI
on:
  push:
    branches:
      - main
      - development/mac-xcode
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun swift --version
          python3 scripts/inspect_apple_sdk.py
      - name: Validate project structure
        run: python3 scripts/validate_project.py
      - name: Inspect actual development environment
        run: |
          set -o pipefail
          mkdir -p .build/logs
          python3 scripts/inspect_development_environment.py --probe-simulator-menu 2>&1 | tee .build/logs/environment.log
      - name: Run simulator unit and UI tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/logs
          python3 scripts/validate_project.py --xcode 2>&1 | tee .build/logs/simulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test-logs
          path: .build/logs/
  device-release-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun swift --version
          python3 scripts/inspect_apple_sdk.py
      - name: Compile unsigned device Release build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/logs
          xcodebuild build -project LyricsCarPlay.xcodeproj -scheme LyricsCarPlay -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee .build/logs/device-release.log
      - name: Run Clang static analyzer
        shell: bash
        run: |
          set -o pipefail
          xcodebuild analyze -project LyricsCarPlay.xcodeproj -scheme LyricsCarPlay -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee .build/logs/analyze.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-release-build-logs
          path: .build/logs/
